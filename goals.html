<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Planner</title>
    <link rel="stylesheet" href="./goals.css">
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime"
        }
      }
    </script>
  </head>
  <body>
    <a class="goals-back" href="./index.html">&larr; Back to Planner</a>
    <div id="root"></div>
    <div class="goals-auth" id="goalsAuth" hidden>
      <div class="goals-auth-card">
        <p class="goals-auth-kicker">Goal Planner</p>
        <h1 id="goalsAuthTitle">Sign in to sync your goals</h1>
        <p id="goalsAuthMessage">Use the same account on every device.</p>
        <form id="goalsAuthForm">
          <input id="goalsEmail" type="email" placeholder="Email" autocomplete="email" required>
          <input id="goalsPassword" type="password" placeholder="Password" autocomplete="current-password" minlength="6" required>
          <button type="submit" id="goalsAuthSubmit">Sign in</button>
        </form>
        <button type="button" id="goalsAuthSwitch">Need an account? Sign up</button>
        <p class="goals-auth-error" id="goalsAuthError" role="alert"></p>
      </div>
    </div>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
    <script type="module" src="./goals-loader.js"></script>
  </body>
</html>
