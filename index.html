<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600&family=Dancing+Script:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="study-planner.css">

<div id="app"></div>
<div class="toast" id="toast"></div>

<div class="auth-shell" id="authShell" hidden>
	<div class="auth-card">
		<div class="auth-kicker">Study Planner</div>
		<h1 id="authTitle">Your plans, anywhere.</h1>
		<p class="auth-subtitle" id="authSubtitle">Create an account to keep your planner in sync across devices.</p>
		<form id="authForm">
			<label class="auth-label" for="authEmail">Email</label>
			<input class="auth-input" id="authEmail" type="email" autocomplete="email" required>
			<label class="auth-label" for="authPassword">Password</label>
			<input class="auth-input" id="authPassword" type="password" autocomplete="current-password" minlength="6" required>
			<button class="auth-submit" id="authSubmit" type="submit">Sign in</button>
		</form>
		<button class="auth-switch" id="authSwitch" type="button">Need an account? Sign up</button>
		<p class="auth-error" id="authError" role="alert"></p>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="study-planner.js"></script>
