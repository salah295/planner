<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{color-scheme:dark;--bg:#080a0f;--card:#0f1219;--card2:#141823;--line:#1e2432;--ink:#e9ecf3;--mute:#8791a3;--acc:#4f46e5;--ok:#22c55e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:40}
h1,h2,h3{margin:0}button{font-family:inherit;color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.mute{color:var(--mute)}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font:600 14px Inter,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:#f87171}.btn.g{border:0;background:none}
:focus-visible{outline:2px solid #818cf8;outline-offset:2px}
.c-b{--c:#60a5fa;--bg2:#1e3a8a73}.c-g{--c:#4ade80;--bg2:#14532d80}.c-p{--c:#c084fc;--bg2:#581c8773}.c-o{--c:#fb923c;--bg2:#7c2d1273}.c-t{--c:#2dd4bf;--bg2:#134e4a80}.c-r{--c:#f472b6;--bg2:#83184373}
.c-High{--c:#f87171;--bg2:#7f1d1d80}.c-Medium{--c:#fbbf24;--bg2:#78350f80}.c-Low{--c:#4ade80;--bg2:#14532d80}
.c-IP{--c:#60a5fa;--bg2:#1e3a8a59}.c-NS{--c:#aab3c2;--bg2:#3741518c}.c-DN{--c:#4ade80;--bg2:#14532d59}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;background:var(--bg2);color:var(--c);white-space:nowrap}
.dt{display:inline-block;width:8px;height:8px;border-radius:9px;background:var(--c);flex:none}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:var(--card2);flex:none}
.chk{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;cursor:pointer;flex:none}
.chk i{width:20px;height:20px;border-radius:6px;border:1.5px solid #5b6578;display:grid;place-items:center;font:700 13px Inter;font-style:normal;color:#04210f}
.chk.on i{background:var(--ok);border-color:var(--ok)}
.done .tt{text-decoration:line-through;color:var(--mute)}
.tab{min-height:44px;padding:0 12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font-weight:500;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--acc);font-weight:600}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:3px;overflow-x:auto}
.seg button{min-height:38px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--mute);font-weight:500;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse}th{font-weight:500;color:var(--mute);text-align:left;font-size:12px;padding:8px 6px}
td{padding:2px 6px;border-top:1px solid var(--line)}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.day{min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:5px 2px;gap:3px;cursor:pointer;font:500 13px Inter,sans-serif;color:var(--ink)}
.day.out{opacity:.35}.day.sel{border-color:var(--acc);background:#1b1d44}.day .n{width:22px;height:22px;display:grid;place-items:center;border-radius:6px}.day.tod .n{background:var(--acc)}
.day .ev{display:none}.day .dots{display:flex;gap:2px}
.ev{width:100%;text-align:left;font-size:11px;border-radius:6px;padding:3px 6px;background:var(--bg2);color:var(--c);border-left:3px solid var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev small{display:block;opacity:.8;font-size:10px}
@media(min-width:1024px){.day{min-height:92px;align-items:stretch;padding:6px;text-align:left}.day .ev{display:block}.day .dots{display:none}}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,26px);gap:4px;align-items:center;min-height:30px}
.hd{width:22px;height:22px;border-radius:99px;border:1.5px solid #3a4254;background:none;cursor:pointer;padding:0;color:#04210f;font:700 12px Inter}.hd.on{background:var(--ok);border-color:var(--ok)}.hd:disabled{opacity:.4}
.hm{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;color:#04210f;font-weight:700}.hm.on{background:var(--ok);border-color:var(--ok)}.hm:disabled{opacity:.35}
.habit-card{border-top:1px solid var(--line);padding:12px 0}.habit-card:first-child{border-top:0}.habit-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.habit-day{min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mute);cursor:pointer}.habit-day.on{background:#14532d59;border-color:#22c55e;color:#4ade80}.habit-day i{font-style:normal;font-size:14px;font-weight:700}
.habit-analysis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}.habit-stat{min-width:0;padding:10px 8px;border-radius:10px;background:var(--card2);text-align:center}.habit-stat b{display:block;font-size:20px}.habit-stat span{display:block;color:var(--mute);font-size:11px;margin-top:2px}.habit-progress{height:7px;border-radius:99px;background:var(--line);overflow:hidden}.habit-progress i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.day-timeline{border-top:1px solid var(--line);position:relative}.timeline-grid{position:relative;height:1392px}.timeline-hour{position:absolute;left:0;right:0;height:58px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px minmax(0,1fr)}.timeline-hour>.time{padding-top:8px;color:var(--mute);font-size:11px}.timeline-events{border-left:1px solid var(--line);position:relative}.timeline-event{position:absolute;min-height:24px;padding:4px 5px;border-radius:8px;background:var(--bg2);border-left:3px solid var(--c);overflow:hidden}
details>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px}details>summary::-webkit-details-marker{display:none}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#0a0c12 30%,#161c2b)}
.mt{position:absolute;right:0;bottom:0;width:70%;height:100%;opacity:.9}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#080a0f 25%,transparent 80%)}
.hero>*{position:relative;z-index:1}
.bn{padding-bottom:env(safe-area-inset-bottom,0px)}.bn a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--mute);gap:2px;cursor:pointer}.bn a.on{color:#a5b4fc}.bn b{font-size:19px;line-height:1}
input,select{width:100%;min-height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px Inter,sans-serif}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#e9ecf3;color:#0b0d12;padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;display:none}
.auth-panel{width:min(420px,calc(100% - 32px));padding:24px;border-radius:16px}
.auth-panel input{margin-bottom:10px}
@media(max-width:767px){
 main{width:100%;max-width:100%;min-width:0}
 main>*{min-width:0}
 .cards,.tasks,.hab,.mus,.not,.upc{max-width:100%;min-width:0}
 body .sec{display:none}
 body[data-v=home] :is(.hero,.cards,.tasks,.mus,.not,.hab,.upc),body[data-v=tasks] .tasks,body[data-v=cal] .cal,body[data-v=habits] .hab,body[data-v=more] :is(.mus,.not,.upc,.ban){display:block}
 .ban{order:9}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<header class="md:hidden sticky z-30 flex items-center gap-2 px-2 h-14 border-b" style="top:env(safe-area-inset-top,0px);background:var(--card);border-color:var(--line)">
  <button class="btn g" data-a="drawer" aria-label="Open menu" style="font-size:20px">☰</button>
  <h1 class="text-lg font-bold flex-1" id="ttl">Home</h1>
</header>

<main class="p-3 md:p-6 lg:p-8 pb-28 md:pb-8 max-w-[1400px] mx-auto grid gap-4">

    <div class="flex flex-col gap-3">
      <div class="w-11 h-11 rounded-xl border-2 border-white grid place-items-center text-2xl font-bold bg-black">L</div>
      <button class="text-left" data-a="edit-hero" aria-label="Edit hero">
        <h1 class="text-3xl md:text-5xl font-bold tracking-tight" id="heroTitle">Life Planner</h1>
        <p class="mute text-xs md:text-sm" id="heroTagline">Plan Better &nbsp;·&nbsp; Do More &nbsp;·&nbsp; Live Greater</p>
      </button>
    </div>
    <button class="hidden md:block max-w-[220px] text-right mute text-lg bg-transparent border-0" style="letter-spacing:.04em" data-a="edit-hero" id="heroQuote">A little progress each day adds up to big results.</button>
  </section>

      <section class="sec card cal p-3 md:p-5" id="cal"></section>

    </div>

    </aside>
  </div>
</main>

<nav class="bn md:hidden fixed bottom-0 inset-x-0 z-30 flex border-t" style="background:var(--card);border-color:var(--line)" id="bn"></nav>

const save=()=>{const data={tasks:S.tasks,events:S.events,habits:S.habits,homeHabitIds:S.homeHabitIds,eventTypes:S.eventTypes,nid:S.nid,notes:S.notes,music:S.music,upcoming:S.upcoming,hero:S.hero,cardTitles:S.cardTitles,cardItems:S.cardItems};try{localStorage.setItem('lp1',JSON.stringify(data))}catch(e){}
 clearTimeout(save.remoteTimer);save.remoteTimer=setTimeout(()=>syncRemote(data),500)};
async function syncRemote(data){if(!S.user)return;const {error}=await supabaseClient.from('life_planners').upsert({user_id:S.user.id,data,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)toast('Could not sync: '+error.message)}
async function loadRemote(){if(!S.user)return;const {data,error}=await supabaseClient.from('life_planners').select('data').eq('user_id',S.user.id).maybeSingle();
 if(error){toast('Could not load planner: '+error.message);return}
 if(data?.data){Object.assign(S,data.data);normalizeEvents();if(!S.eventTypes||!S.eventTypes.length)S.eventTypes=[{name:'Work',c:'b'},{name:'Health',c:'g'},{name:'Study',c:'p'},{name:'Personal',c:'p'},{name:'Family',c:'o'},{name:'Finance',c:'o'},{name:'Content',c:'r'},{name:'Other',c:'r'}];if(!S.cardTitles)S.cardTitles=['Daily','Planners','Personal','Goals'];if(!S.cardItems)S.cardItems=[['Today','This Week','Journal'],['Yearly Planner','Monthly Planner','Weekly Planner'],['Health & Fitness','Mindset & Growth','Finance'],['Career','Health','Lifestyle']];try{localStorage.setItem('lp1',JSON.stringify(data.data))}catch(e){}}else{normalizeEvents();syncRemote({tasks:S.tasks,events:S.events,habits:S.habits,homeHabitIds:S.homeHabitIds,eventTypes:S.eventTypes,nid:S.nid,notes:S.notes,music:S.music,upcoming:S.upcoming,hero:S.hero,cardTitles:S.cardTitles,cardItems:S.cardItems})}render();}
const showAuth=show=>{$('#authOverlay').classList.toggle('hidden',!show);$('#authOverlay').classList.toggle('flex',show)};

const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)};
const normalizeEvents=()=>{S.events.forEach(e=>{if(!e.start)e.start=e.time||'09:00';if(!e.end)e.end='';if(!e.note)e.note='';if(!e.type){const match=S.eventTypes?.find(type=>type.c===e.c);e.type=match?.name||'Other';e.c=match?.c||e.c||'r'}})};
const eventTime=e=>e.end?`${f12(e.start)} – ${f12(e.end)}`:f12(e.start||e.time||'09:00');
const es=(a,b)=>(a.date+(a.start||a.time||'')).localeCompare(b.date+(b.start||b.time||''));

const CARDS=[['Daily','☀','tasks',['Today','This Week','Journal']],['Planners','▦','cal',['Yearly Planner','Monthly Planner','Weekly Planner']],['Personal','☺','habits',['Health & Fitness','Mindset & Growth','Finance']],['Goals','◎','more',['Career','Health','Lifestyle']]];
function getUpcomingPlans(){
 const today=S.upcoming.filter(p=>p.date===TODAY).sort((a,b)=>a.t.localeCompare(b.t));
 const overdue=S.upcoming.filter(p=>p.date<TODAY).sort((a,b)=>b.date.localeCompare(a.date)||a.t.localeCompare(b.t));
 const future=S.upcoming.filter(p=>p.date>TODAY).sort((a,b)=>a.date.localeCompare(b.date)||a.t.localeCompare(b.t));
 return [...today,...overdue,...future];
}
function cards(){
 const priority={High:0,Medium:1,Low:2};
 const taskPriority=(a,b)=>(priority[a.pri]??3)-(priority[b.pri]??3)||a.due.localeCompare(b.due)||a.t.localeCompare(b.t);
 const todayTasks=S.tasks.filter(t=>t.st!=='Done'&&t.due===TODAY).sort(taskPriority);
 const overdueTasks=S.tasks.filter(t=>t.st!=='Done'&&t.due<TODAY&&!todayTasks.includes(t)).sort(taskPriority);
 const upcomingTasks=S.tasks.filter(t=>t.st!=='Done'&&t.due>TODAY&&!todayTasks.includes(t)).sort((a,b)=>a.due.localeCompare(b.due)||(priority[a.pri]??3)-(priority[b.pri]??3)||a.t.localeCompare(b.t));
 const topTasks=[...todayTasks,...overdueTasks,...upcomingTasks].slice(0,3);
 let topHabits=[];
 if(Array.isArray(S.homeHabitIds)){
  topHabits=S.homeHabitIds.map(id=>S.habits.find(h=>h.id==id)).filter(Boolean).slice(0,3);
 }
 if(!topHabits.length)topHabits=[...S.habits].sort((a,b)=>b.d.length-a.d.length||a.n.localeCompare(b.n)).slice(0,3);
 const nextPlans=getUpcomingPlans().slice(0,3);
 const items=[
  topTasks.map(t=>({name:t.t,key:'task:'+t.id,done:t.st==='Done',kind:'task',id:t.id,meta:t.pri+(t.due<TODAY?' · Overdue':t.due>TODAY?' · '+fd(t.due,{month:'short',day:'numeric'}):'')})),
  nextPlans.map(p=>({name:p.t,key:'plan:'+p.id,done:false,kind:'plan',id:p.id,meta:fd(p.date,{month:'short',day:'numeric'})+(p.date<TODAY?' · Overdue':'')})),
  topHabits.map(h=>({name:h.n,key:'habit:'+h.id,done:h.d.includes(Number(TODAY.slice(-2))),kind:'habit',id:h.id,meta:h.d.length+' days'})),
  (S.cardItems[3]||[]).map((x,itemIndex)=>({name:x,key:'goal:'+itemIndex,done:!!S.tk[x],kind:'goal',id:itemIndex,meta:''}))
 ];
 $('#cards').innerHTML=CARDS.map(([n,i,v],index)=>{
  const list=items[index];
   const rows=list.map((x,itemIndex)=>{
    if(x.kind==='habit'){
     return `<div class="flex items-center gap-1"><button class="chk" style="width:36px;height:40px" data-a="toggle-home-habit" data-id="${x.id}" aria-label="${x.done?'Mark incomplete':'Mark complete'}: ${esc(x.name)}"><i style="width:16px;height:16px;${x.done?'background:var(--ok);border-color:var(--ok)':''}">${x.done?'✓':''}</i></button><button class="flex items-center gap-2 flex-1 min-w-0 min-h-[40px] bg-transparent border-0 cursor-pointer mute text-left text-[13px]" data-a="go" data-v="habits"><span class="min-w-0 flex-1"><span class="block truncate">${esc(x.name)}</span>${x.meta?`<small class="block text-[10px] opacity-75">${esc(x.meta)}</small>`:''}</span></button></div>`;
    }
    return `<div class="flex items-center gap-1"><button class="flex items-center gap-2 flex-1 min-w-0 min-h-[40px] bg-transparent border-0 cursor-pointer mute text-left text-[13px]" ${x.kind==='task'?`data-a="tog" data-id="${x.id}"`:x.kind==='plan'?`data-a="edit-upcoming" data-id="${x.id}"`:`data-a="tk" data-k="${esc(x.name)}"`}><span class="chk" style="width:20px;height:20px"><i style="width:16px;height:16px;${x.done?'background:var(--ok);border-color:var(--ok)':''}">${x.done?'✓':''}</i></span><span class="min-w-0 flex-1"><span class="block truncate">${esc(x.name)}</span>${x.meta?`<small class="block text-[10px] opacity-75">${esc(x.meta)}</small>`:''}</span></button>${x.kind==='goal'?`<button class="btn g" data-a="edit-card-item" data-card="${index}" data-item="${itemIndex}" aria-label="Edit ${esc(x.name)}">✎</button>`:''}</div>`;
   }).join('');
  return `<div class="card p-3 md:p-4"><div class="flex items-center gap-2 min-h-[44px]"><button class="flex items-center gap-2 flex-1 min-w-0 min-h-[44px] bg-transparent border-0 cursor-pointer text-left" data-a="go" data-v="${v}"><span class="ico">${i}</span><b class="text-[15px] truncate">${esc(S.cardTitles[index]||n)}</b></button><button class="btn g" data-a="edit-card" data-index="${index}" aria-label="Edit ${esc(S.cardTitles[index]||n)}">✎</button></div>${rows||'<p class="mute text-xs py-2">Nothing to show.</p>'}</div>`;
 }).join('');
}

const tCard=t=>`<div class="card flex items-center pr-1 ${t.st==='Done'?'done':''}" style="background:var(--card2)"><button class="chk ${t.st==='Done'?'on':''}" data-a="tog" data-id="${t.id}" aria-label="Mark done"><i>${t.st==='Done'?'✓':''}</i></button><div class="flex-1 min-w-0 py-2"><div class="tt font-semibold break-words">${esc(t.t)}</div><div class="flex flex-wrap gap-1.5 mt-1 items-center"><span class="chip c-${CC[t.cat]}">${t.cat}</span><span class="chip c-${t.pri}">${t.pri}</span><span class="text-xs mute">${fd(t.due,{month:'short',day:'numeric'})}</span></div></div><button class="btn g" data-a="edit" data-id="${t.id}" aria-label="Edit">✎</button><button class="btn g d" data-a="del" data-id="${t.id}" aria-label="Delete">🗑</button></div>`;
const tRow=t=>`<tr class="${t.st==='Done'?'done':''}"><td style="width:48px"><button class="chk ${t.st==='Done'?'on':''}" data-a="tog" data-id="${t.id}" aria-label="Mark done"><i>${t.st==='Done'?'✓':''}</i></button></td><td class="tt font-medium">${esc(t.t)}</td><td><span class="chip c-${CC[t.cat]}">${t.cat}</span></td><td><span class="chip c-${t.pri}">${t.pri}</span></td><td><span class="chip c-${SC[t.st]}">${t.st}</span></td><td class="mute whitespace-nowrap">${fd(t.due)}</td><td class="whitespace-nowrap text-right"><button class="btn g" data-a="edit" data-id="${t.id}" aria-label="Edit">✎</button><button class="btn g d" data-a="del" data-id="${t.id}" aria-label="Delete">🗑</button></td></tr>`;
function tasks(){
 const l=S.tasks.filter(t=>S.f==='All'||(S.f==='Others'?!['Work','Personal','Health','Study'].includes(t.cat):t.cat===S.f)).sort((a,b)=>a.due.localeCompare(b.due));
 $('#tasks').innerHTML=`<div class="flex items-center justify-between gap-2 mb-2"><h2 class="text-lg font-semibold flex items-center gap-2"><span class="ico" style="background:#14532d;color:#4ade80">✓</span>Today’s Tasks</h2><div class="flex items-center gap-3"><span class="mute text-xs hidden md:inline">${fd(TODAY,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span><button class="btn hidden md:inline-flex" data-a="new" data-k="task">+ New Task</button></div></div>
 <div class="flex overflow-x-auto border-b mb-1" style="border-color:var(--line)">${['All','Work','Personal','Health','Study','Others'].map(x=>`<button class="tab ${S.f===x?'on':''}" data-a="flt" data-f="${x}">${x}</button>`).join('')}</div>
 <div class="hidden md:block"><table><thead><tr><th></th><th>Task Name</th><th>Category</th><th>Priority</th><th>Status</th><th>Due Date</th><th></th></tr></thead><tbody>${l.map(tRow).join('')}</tbody></table></div>
 <div class="md:hidden grid gap-2 mt-2">${l.map(tCard).join('')}</div>${l.length?'':'<p class="mute py-4">No tasks here. Add one to get started.</p>'}`;}

const evI=(e,showD)=>`<div class="flex items-center gap-3 py-1 c-${e.c}"><span class="dt"></span><div class="flex-1 min-w-0"><div class="font-medium break-words">${esc(e.t)}</div><div class="text-xs mute">${showD?fd(e.date,{weekday:'short',month:'short',day:'numeric'})+', ':''}${eventTime(e)}</div>${e.note?`<div class="text-xs mt-1 break-words" style="color:var(--mute)">↳ ${esc(e.note)}</div>`:''}</div><button class="btn g" data-a="edit-event" data-id="${e.id}" aria-label="Edit event">✎</button><button class="btn g d" data-a="dev" data-id="${e.id}" aria-label="Delete event">🗑</button></div>`;
function cal(){
 const m=S.month,y=m.getFullYear(),mo=m.getMonth(),st=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate(),n=Math.ceil((st+dim)/7)*7;
 let body='';
 if(S.mode==='Month'){let c='';for(let i=0;i<n;i++){const d=new Date(y,mo,1-st+i),k=iso(d),ev=S.events.filter(e=>e.date===k).sort(es);
  c+=`<button class="day ${d.getMonth()!==mo?'out':''} ${k===S.sel?'sel':''} ${k===TODAY?'tod':''}" data-a="sel" data-d="${k}" aria-label="${fd(k)}"><span class="n">${d.getDate()}</span><span class="dots">${ev.slice(0,3).map(e=>`<i class="dt c-${e.c}"></i>`).join('')}</span>${ev.slice(0,2).map(e=>`<span class="ev c-${e.c}">${esc(e.t)}<small>${eventTime(e)}</small></span>`).join('')}</button>`}
  const day=S.events.filter(e=>e.date===S.sel).sort(es);
  body=`<div class="dgrid text-center mute text-xs mb-1">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div>${x}</div>`).join('')}</div><div class="dgrid">${c}</div><div class="mt-3 p-3 rounded-xl" style="background:var(--card2)"><b>${fd(S.sel,{weekday:'long',month:'long',day:'numeric'})}</b>${day.map(e=>evI(e)).join('')||'<p class="mute m-0 py-2">Nothing planned. Tap + to add an event.</p>'}</div>`;}
 else if(S.mode==='Day'){
  const dayEvents=S.events.filter(e=>e.date===S.sel).sort(es);
  const hourLabel=h=>h===0?'12 AM':h<12?`${h} AM`:h===12?'12 PM':`${h-12} PM`;
  const minutes=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
  const timed=dayEvents.map(e=>{
   const start=minutes(e.start||e.time||'09:00');
   const end=e.end?minutes(e.end):start+60;
   return {...e,_start:start,_end:end};
  }).sort((a,b)=>a._start-b._start||b._end-a._end);
  const groups=[];
  timed.forEach(e=>{
   let group=groups.find(g=>g.some(x=>e._start<x._end&&e._end>x._start));
   if(!group){group=[];groups.push(group)}
   group.push(e);
  });
  const laid=[];
  groups.forEach(group=>{
   const columns=[];
   group.forEach(e=>{
    let column=columns.findIndex(col=>col.every(x=>e._start>=x._end||e._end<=x._start));
    if(column<0){column=columns.length;columns.push([])}
    columns[column].push(e);
    e._column=column;
   });
   const columnCount=columns.length;
   group.forEach(e=>e._columnCount=columnCount);
   laid.push(...group);
  });
  const hours=Array.from({length:24},(_,h)=>`<div class="timeline-hour" style="top:${h*58}px"><div class="time">${hourLabel(h)}</div><div class="timeline-events"></div></div>`).join('');
  const eventsHtml=laid.map(e=>{
   const top=e._start/60*58+2;
   const height=Math.max(24,(e._end-e._start)/60*58-4);
   const width=100/e._columnCount;
   const leftPercent=e._column*width;
   const leftOffset=64*e._column/e._columnCount;
   return `<div class="timeline-event c-${e.c}" style="top:${top}px;height:${height}px;left:calc(64px + ${leftPercent}% - ${leftOffset}px);width:calc(${width}% - ${64/e._columnCount}px - 8px);z-index:${10+e._column}"><div class="flex items-start gap-1"><span class="dt mt-1"></span><div class="flex-1 min-w-0"><div class="font-medium break-words text-xs">${esc(e.t)}</div><div class="text-[10px] mute">${eventTime(e)}</div>${e.note&&height>=65?`<div class="text-[10px] mt-1 break-words" style="color:var(--mute)">↳ ${esc(e.note)}</div>`:''}</div><button class="btn g" style="min-width:28px;width:28px;min-height:28px;height:28px;padding:0" data-a="edit-event" data-id="${e.id}" aria-label="Edit event">✎</button><button class="btn g d" style="min-width:28px;width:28px;min-height:28px;height:28px;padding:0" data-a="dev" data-id="${e.id}" aria-label="Delete event">🗑</button></div></div>`;
  }).join('');
  body=`<div class="mb-2"><b>${fd(S.sel,{weekday:'long',month:'long',day:'numeric'})}</b></div><div class="day-timeline"><div class="timeline-grid">${hours}${eventsHtml}</div></div>`;
 }else{let l;if(S.mode==='Week'){const s=new Date(S.sel+'T00:00');s.setDate(s.getDate()-s.getDay());const a=iso(s);s.setDate(s.getDate()+6);l=S.events.filter(e=>e.date>=a&&e.date<=iso(s))}else l=S.events.filter(e=>e.date>=TODAY).slice(0).sort(es).slice(0,12);
  body=`<div class="divide-y" style="--tw-divide-opacity:1">${l.sort(es).map(e=>evI(e,true)).join('')||'<p class="mute py-4">No events in this view.</p>'}</div>`;}
 $('#cal').innerHTML=`<div class="flex flex-wrap items-center gap-2 mb-3"><h2 class="text-lg font-semibold flex items-center gap-2 mr-auto"><span class="ico" style="background:#312e81">▦</span>Calendar</h2>
 <div class="flex items-center"><button class="btn g" data-a="mo" data-n="-1" aria-label="Previous month">‹</button><b class="min-w-[110px] text-center">${m.toLocaleDateString('en',{month:'long',year:'numeric'})}</b><button class="btn g" data-a="mo" data-n="1" aria-label="Next month">›</button></div>
 <div class="seg max-w-full">${['Month','Week','Day','Agenda'].map(x=>`<button class="${S.mode===x?'on':''}" data-a="mode" data-m="${x}">${x}</button>`).join('')}</div><button class="btn hidden md:inline-flex" data-a="new" data-k="event">+ Event</button></div>${body}`;}

function hab(){
 const wd=[16,17,18,19,20,21,22],L='MTWTFSS';
 const streak=h=>{const ds=[...h.d].sort((a,b)=>a-b);let best=0,run=0,last=null;ds.forEach(d=>{run=(last!==null&&d===last+1)?run+1:1;best=Math.max(best,run);last=d});return best};
 const total=S.habits.reduce((n,h)=>n+h.d.length,0);
 const possible=S.habits.length*30;
 const rate=possible?Math.round(total/possible*100):0;
 const ranked=S.habits.map(h=>({h,score:h.d.length,streak:streak(h)})).sort((a,b)=>b.score-a.score);
 const best=ranked[0];
 const wkr=`<div class="hidden md:block"><div class="hrow mute text-xs"><span></span>${[...L].map(x=>`<span class="text-center">${x}</span>`).join('')}</div>${S.habits.map(h=>`<div class="hrow"><div class="flex items-center gap-1 min-w-0"><button class="text-left truncate text-[13px] bg-transparent border-0 cursor-pointer flex-1" data-a="edit-habit" data-id="${h.id}" title="Edit habit">${esc(h.n)} ✎</button><button class="btn g d" style="min-width:44px" data-a="del-habit" data-id="${h.id}" aria-label="Remove ${esc(h.n)}">🗑</button></div>${wd.map(d=>`<button class="hd ${h.d.includes(d)?'on':''}" data-a="hab" data-id="${h.id}" data-d="${d}" aria-label="${esc(h.n)}, Nov ${d}">${h.d.includes(d)?'✓':''}</button>`).join('')}</div>`).join('')}</div>`;
 const mg=`<div class="md:hidden">${S.habits.map(h=>`<div class="habit-card"><div class="flex items-center gap-2 mb-2"><button class="text-left flex-1 min-w-0 bg-transparent border-0 font-semibold cursor-pointer" data-a="edit-habit" data-id="${h.id}">${esc(h.n)}</button><span class="chip">${h.d.length} / 30 days</span><button class="btn g d" data-a="del-habit" data-id="${h.id}" aria-label="Remove ${esc(h.n)}">🗑</button></div><div class="habit-days">${wd.map(d=>`<button class="habit-day ${h.d.includes(d)?'on':''}" data-a="hab" data-id="${h.id}" data-d="${d}" aria-label="${esc(h.n)}, Nov ${d}"><span>${L[wd.indexOf(d)]}</span><i>${h.d.includes(d)?'✓':d}</i></button>`).join('')}</div></div>`).join('')||'<p class="mute py-3">No habits yet. Add one to begin tracking.</p>'}</div>`;
 const analysis=`<details open class="mt-3 rounded-xl p-3" style="background:var(--card2)"><summary><h4 class="font-semibold">Habit Analysis</h4><span class="mute">▾</span></summary><div class="habit-analysis"><div class="habit-stat"><b>${rate}%</b><span>Completion</span></div><div class="habit-stat"><b>${best?best.streak:0}</b><span>Best streak</span></div><div class="habit-stat"><b class="truncate">${best?esc(best.h.n):'—'}</b><span>Top habit</span></div></div><div class="habit-progress" aria-label="${rate}% completed"><i style="width:${rate}%"></i></div></details>`;
 $('#hab').innerHTML=`<div class="flex items-center justify-between mb-2"><h3 class="font-semibold flex items-center gap-2"><span class="ico" style="background:#14532d;color:#4ade80">✓</span>Habit Tracker</h3><button class="btn g" data-a="new-habit" aria-label="Add habit">+</button></div><div class="mute text-xs mb-2">November 16–22, 2026</div>${wkr}${mg}${analysis}`;}

function upcoming(){const el=$('#upc');if(!el)return;
 el.innerHTML=`<div class="flex justify-end -mt-10 mb-2"><button class="btn g" data-a="new-upcoming" aria-label="Add upcoming item">+</button></div>`+S.upcoming.map(u=>`<div class="flex items-center gap-3 py-2 c-${u.c} border-t" style="border-color:var(--line)"><span class="dt" style="width:11px;height:11px"></span><div class="flex-1 min-w-0"><button class="text-left bg-transparent border-0 cursor-pointer p-0" data-a="edit-upcoming" data-id="${u.id}"><div class="font-medium">${esc(u.t)} ✎</div><div class="text-xs mute">${fd(u.date,{month:'short',day:'numeric',year:'numeric'})}</div></button></div><span class="chip">${esc(u.cat)}</span><button class="btn g d" data-a="del-upcoming" data-id="${u.id}" aria-label="Remove ${esc(u.t)}">🗑</button></div>`).join('')||'<p class="mute py-3">No upcoming plans.</p>';}

function render(){
 document.body.dataset.v=S.v;$('#ttl').textContent=TT[S.v];
 const nv=NAV.map(([v,l,i])=>`<a class="${S.v===v?'on':''}" data-a="go" data-v="${v}" role="button" tabindex="0"><b>${i}</b>${l}</a>`).join('');
 $('#bn').innerHTML=nv;$('#dn').innerHTML=NAV.map(([v,l,i])=>`<a class="flex items-center gap-3 min-h-[48px] px-3 rounded-xl font-semibold cursor-pointer ${S.v===v?'bg-[#1b1d44]':''}" data-a="go" data-v="${v}" role="button" tabindex="0">${i} ${l}</a>`).join('');
 $('#fab').style.display=['home','tasks','cal'].includes(S.v)?'':'none';
 cards();tasks();cal();hab();upcoming();
 $('#heroTitle').textContent=S.hero.title;$('#heroTagline').textContent=S.hero.tagline;$('#heroQuote').textContent=S.hero.quote;
 $('#quickNotes').innerHTML=S.notes.map(n=>`<li>${esc(n)}</li>`).join('');
 $('#musicTitle').textContent=S.music.title;$('#musicArtist').textContent=S.music.artist;$('#musicElapsed').textContent=S.music.elapsed;$('#musicDuration').textContent=S.music.duration;}

function openForm(k,id){
 const t=k==='task'&&id?S.tasks.find(x=>x.id==id):null;
 const e=k==='event'&&id?S.events.find(x=>x.id==id):null;
 const h=k==='habit'&&id?S.habits.find(x=>x.id==id):null;
 const u=k==='upcoming'&&id?S.upcoming.find(x=>x.id==id):null;
 const o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
 let f='',title='';
 if(k==='task'){title=t?'Edit task':'New task';f=`<label for="f1">Title</label><input id="f1" name="t" value="${t?esc(t.t):''}" autocomplete="off"><div class="grid grid-cols-2 gap-3"><div><label>Category</label><select name="cat">${o(Object.keys(CC),t&&t.cat)}</select></div><div><label>Priority</label><select name="pri">${o(['High','Medium','Low'],t?t.pri:'Medium')}</select></div></div><div class="grid grid-cols-2 gap-3"><div><label>Status</label><select name="st">${o(Object.keys(SC),t?t.st:'Not Started')}</select></div><div><label>Due date</label><input type="date" name="d" value="${t?t.due:S.sel}"></div></div>`;}
 else if(k==='event'){title=e?'Edit event':'New event';const labels=S.eventTypes.map(type=>`<option value="${esc(type.name)}" ${e?(e.type===type.name?'selected':''):(type.name==='Work'?'selected':'')}>${esc(type.name)}</option>`).join('');const start=e?(e.start||e.time||'09:00'):'09:00',end=e?(e.end||''):'',note=e?(e.note||''):'';f=`<label for="f1">Title</label><input id="f1" name="t" value="${e?esc(e.t):''}" autocomplete="off"><label>Date</label><input type="date" name="d" value="${e?e.date:S.sel}"><div class="grid grid-cols-2 gap-3"><div><label>Start time</label><input type="time" name="start" value="${start}" required></div><div><label>End time</label><input type="time" name="end" value="${end}"></div></div><label>Type</label><div class="flex items-center gap-2"><select name="type" id="eventType" class="flex-1">${labels}</select><button type="button" class="btn g d" style="width:44px;min-width:44px;padding:0" data-a="remove-event-type" aria-label="Remove selected event type" title="Remove selected type">🗑</button></div><label>New type</label><div class="flex gap-2"><input name="newEventType" class="flex-1" placeholder="Type name" autocomplete="off"><button type="button" class="btn p" style="min-width:44px;width:44px;padding:0" data-a="add-event-type" aria-label="Add event type" title="Add type">+</button></div><label for="eventNote">Comment / Instructions <span class="mute font-normal">(optional)</span></label><textarea id="eventNote" name="note" class="w-full min-h-[90px] rounded-xl p-3" style="border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px Inter,sans-serif" placeholder="Add details or instructions">${esc(note)}</textarea>`;}
 else if(k==='habit'){title=h?'Edit habit':'New habit';f=`<label for="f1">Habit name</label><input id="f1" name="n" value="${h?esc(h.n):''}" autocomplete="off">`;}
 else if(k==='notes'){title='Edit quick notes';f=`<label for="f1">One note per line</label><textarea id="f1" name="n" class="w-full min-h-[180px] rounded-xl p-3" style="border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px Inter,sans-serif">${S.notes.map(esc).join('\n')}</textarea>`;}
 else if(k==='music'){title='Edit now playing';f=`<label for="f1">Track title</label><input id="f1" name="title" value="${esc(S.music.title)}"><label>Artist</label><input name="artist" value="${esc(S.music.artist)}"><div class="grid grid-cols-2 gap-3"><div><label>Elapsed</label><input name="elapsed" value="${esc(S.music.elapsed)}"></div><div><label>Duration</label><input name="duration" value="${esc(S.music.duration)}"></div></div>`;}
 else if(k==='hero'){title='Edit hero';f=`<label for="f1">Title</label><input id="f1" name="title" value="${esc(S.hero.title)}"><label>Tagline</label><input name="tagline" value="${esc(S.hero.tagline)}"><label>Quote</label><input name="quote" value="${esc(S.hero.quote)}">`;}
 else if(k==='upcoming'){title=u?'Edit upcoming item':'New upcoming item';f=`<label for="f1">Title</label><input id="f1" name="t" value="${u?esc(u.t):''}" autocomplete="off"><div class="grid grid-cols-2 gap-3"><div><label>Date</label><input type="date" name="d" value="${u?u.date:TODAY}"></div><div><label>Category</label><select name="cat">${o(['Work','Health','Personal','Finance','Study'],u?u.cat:'Personal')}</select></div></div>`;}
 else if(k==='card'){const index=+id,titleValue=S.cardTitles[index]||CARDS[index][0];title=index===2?'Choose habits':'Edit section title';f=`<label for="f1">Section title</label><input id="f1" name="title" value="${esc(titleValue)}" autocomplete="off">${index===2?`<label>Habits shown on Home (choose up to 3)</label><div class="grid gap-2">${S.habits.map(h=>`<label class="flex items-center gap-3 p-2 rounded-lg m-0" style="background:var(--card2);font-weight:500"><input type="checkbox" name="homeHabit" value="${h.id}" ${S.homeHabitIds?.includes(h.id)?'checked':''} style="width:20px;min-height:20px;margin:0"><span>${esc(h.n)}</span></label>`).join('')||'<p class="mute">No habits available.</p>'}</div>`:''}`;}
 else if(k==='card-item'){const [cardIndex,itemIndex]=String(id).split(':').map(Number);const itemValue=S.cardItems[cardIndex]?.[itemIndex]||'';title='Edit card item';f=`<label for="f1">Item name</label><input id="f1" name="title" value="${esc(itemValue)}" autocomplete="off">`;}
 f=`<h2 class="text-xl font-bold mb-1">${title}</h2><input type="hidden" name="k" value="${k}"><input type="hidden" name="id" value="${id||''}">`+f;
 f+=`<div class="flex gap-2 mt-5"><button type="button" class="btn flex-1" data-a="close">Cancel</button>${k==='habit'&&h?'<button type="button" class="btn d" data-a="del-habit" data-id="'+h.id+'">Remove</button>':''}${k==='upcoming'&&u?'<button type="button" class="btn d" data-a="del-upcoming" data-id="'+u.id+'">Remove</button>':''}<button class="btn p flex-1">Save</button></div>`;
 $('#form').innerHTML=f;$('#modal').classList.replace('hidden','flex');setTimeout(()=>$('#f1').focus(),60);}
const closeM=()=>$('#modal').classList.replace('flex','hidden');
$('#form').addEventListener('change',e=>{
 if(e.target.name==='homeHabit'){
  const checked=[...$('#form').querySelectorAll('input[name="homeHabit"]:checked')];
  if(checked.length>3){e.target.checked=false;toast('Choose no more than 3 habits')}
 }
 if(e.target.id==='eventType'){
  const other=$('#otherEventType');
  if(other)other.style.display=e.target.value.endsWith('|Other')?'block':'none';
 }
});
$('#form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),k=f.get('k'),id=f.get('id');
 if(k==='task'){const t=(f.get('t')||'').trim();if(!t){toast('Enter a title first');$('#f1').focus();return}const o={t,cat:f.get('cat'),pri:f.get('pri'),st:f.get('st'),due:f.get('d')||TODAY};id?Object.assign(S.tasks.find(x=>x.id==id),o):S.tasks.push({id:S.nid++,...o});toast('Task saved')}
 else if(k==='event'){const t=(f.get('t')||'').trim(),start=(f.get('start')||'').trim(),end=(f.get('end')||'').trim();if(!t){toast('Enter a title first');$('#f1').focus();return}if(!start){toast('Enter a start time');return}if(end&&end<=start){toast('End time must be after start time');return}const type=(f.get('type')||'Work').trim(),typeItem=S.eventTypes.find(x=>x.name===type)||S.eventTypes.find(x=>x.name==='Other')||{name:'Other',c:'r'},note=(f.get('note')||'').trim();const o={t,date:f.get('d')||S.sel,start,end,time:start,c:typeItem.c,type:typeItem.name,note};id?Object.assign(S.events.find(x=>x.id==id),o):S.events.push({id:S.nid++,...o});toast('Event saved')}
 else if(k==='habit'){const n=(f.get('n')||'').trim();if(!n){toast('Enter a habit name');$('#f1').focus();return}if(id)Object.assign(S.habits.find(x=>x.id==id),{n});else S.habits.push({id:S.nid++,n,d:[]});toast('Habit saved')}
 else if(k==='notes'){S.notes=(f.get('n')||'').split('\n').map(x=>x.trim()).filter(Boolean);toast('Notes saved')}
 else if(k==='music'){S.music={title:(f.get('title')||'').trim()||'Untitled',artist:(f.get('artist')||'').trim()||'Unknown artist',elapsed:(f.get('elapsed')||'').trim()||'0:00',duration:(f.get('duration')||'').trim()||'0:00'};toast('Music saved')}
 else if(k==='hero'){S.hero={title:(f.get('title')||'').trim()||'Life Planner',tagline:(f.get('tagline')||'').trim(),quote:(f.get('quote')||'').trim()};toast('Hero saved')}
 else if(k==='upcoming'){const t=(f.get('t')||'').trim();if(!t){toast('Enter a title first');$('#f1').focus();return}const cat=f.get('cat'),colors={Work:'b',Health:'g',Personal:'p',Finance:'o',Study:'t'},o={t,date:f.get('d')||TODAY,cat,c:colors[cat]||'p'};if(id)Object.assign(S.upcoming.find(x=>x.id==id),o);else S.upcoming.push({id:S.nid++,...o});toast('Upcoming item saved')}
 else if(k==='card'){const title=(f.get('title')||'').trim();if(!title){toast('Enter a section title');$('#f1').focus();return}const index=+id;S.cardTitles[index]=title;if(index===2){const selected=f.getAll('homeHabit').map(Number);if(selected.length>3){toast('Choose no more than 3 habits');return}S.homeHabitIds=selected.length?selected:null}toast(index===2?'Home habits saved':'Section title saved')}
 else if(k==='card-item'){const title=(f.get('title')||'').trim();if(!title){toast('Enter an item name');$('#f1').focus();return}const [cardIndex,itemIndex]=String(id).split(':').map(Number);S.cardItems[cardIndex][itemIndex]=title;toast('Card item saved')}
 save();closeM();render();});

function go(v){S.v=v;$('#drawer').classList.add('hidden');render();if(innerWidth>=768){const m={tasks:'#tasks',cal:'#cal',habits:'#hab',more:'.mih,.not'};const el=m[v]&&document.querySelector(m[v]);el?el.scrollIntoView():scrollTo(0,0)}else scrollTo(0,0)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
 if(a==='go')go(el.dataset.v);
 else if(a==='signout'){supabaseClient.auth.signOut();$('#drawer').classList.add('hidden')}
 else if(a==='drawer')$('#drawer').classList.toggle('hidden');
 else if(a==='new'){$('#drawer').classList.add('hidden');openForm(el.dataset.k||(S.v==='cal'?'event':'task'))}
 else if(a==='edit')openForm('task',id);
 else if(a==='edit-event')openForm('event',id);
 else if(a==='edit-habit')openForm('habit',id);
 else if(a==='new-habit')openForm('habit');
 else if(a==='del-habit'){const h=S.habits.find(x=>x.id==id);if(h&&confirm(`Remove "${h.n}"?`)){S.habits=S.habits.filter(x=>x.id!=id);if(Array.isArray(S.homeHabitIds))S.homeHabitIds=S.homeHabitIds.filter(hid=>hid!=id);save();closeM();toast('Habit removed');hab();cards()}}
 else if(a==='edit-notes')openForm('notes');
 else if(a==='edit-music')openForm('music');
 else if(a==='edit-hero')openForm('hero');
 else if(a==='edit-upcoming')openForm('upcoming',id);
 else if(a==='new-upcoming')openForm('upcoming');
 else if(a==='del-upcoming'){const u=S.upcoming.find(x=>x.id==id);if(u&&confirm(`Remove "${u.t}"?`)){S.upcoming=S.upcoming.filter(x=>x.id!=id);save();toast('Upcoming item removed');render()}}
 else if(a==='edit-card')openForm('card',el.dataset.index);
 else if(a==='edit-card-item')openForm('card-item',el.dataset.card+':'+el.dataset.item);
 else if(a==='add-event-type'){const input=$('#form [name="newEventType"]'),name=input?.value.trim();if(!name){toast('Enter a type name');input?.focus()}else if(S.eventTypes.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('That type already exists')}else{const colors=['b','g','p','o','r','t'];S.eventTypes.push({name,c:colors[S.eventTypes.length%colors.length]});save();openForm('event',$('#form [name="id"]').value||null);toast('Event type added')}}
 else if(a==='remove-event-type'){const select=$('#eventType'),name=select?.value;if(!name)return;if(S.eventTypes.length<=1){toast('Keep at least one event type');return}if(confirm(`Remove "${name}" event type?`)){S.eventTypes=S.eventTypes.filter(x=>x.name!==name);S.events.forEach(e=>{if(e.type===name){e.type='Other';e.c='r'}});save();openForm('event',$('#form [name="id"]').value||null);toast('Event type removed')}}
 else if(a==='close')closeM();
 else if(a==='tog'){const t=S.tasks.find(x=>x.id==id);t.st=t.st==='Done'?'Not Started':'Done';save();tasks();cards()}
 else if(a==='del'){S.tasks=S.tasks.filter(x=>x.id!=id);save();toast('Task deleted');tasks()}
 else if(a==='dev'){S.events=S.events.filter(x=>x.id!=id);save();toast('Event deleted');cal()}
 else if(a==='flt'){S.f=el.dataset.f;tasks()}
 else if(a==='mode'){S.mode=el.dataset.m;cal()}
 else if(a==='sel'){S.sel=el.dataset.d;const d=new Date(S.sel+'T00:00');if(d.getMonth()!==S.month.getMonth())S.month=new Date(d.getFullYear(),d.getMonth(),1);cal()}
 else if(a==='mo'){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+ +el.dataset.n,1);cal()}
 else if(a==='hab'){const h=S.habits.find(x=>x.id==id),d=+el.dataset.d,i=h.d.indexOf(d);i<0?h.d.push(d):h.d.splice(i,1);save();hab()}
 else if(a==='toggle-home-habit'){const h=S.habits.find(x=>x.id==id);if(h){const d=Number(TODAY.slice(-2)),i=h.d.indexOf(d);i<0?h.d.push(d):h.d.splice(i,1);save();cards();hab();toast(i<0?'Habit completed for today':'Habit marked incomplete')}}
 else if(a==='tk'){S.tk[el.dataset.k]=!S.tk[el.dataset.k];cards()}});
$('#play').addEventListener('click',e=>{S.play=!S.play;e.currentTarget.textContent=S.play?'❚❚':'▶'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();$('#drawer').classList.add('hidden')}if((e.key==='Enter'||e.key===' ')&&e.target.matches('a[data-a]')){e.preventDefault();e.target.click()}});
async function initAuth(){const {data}=await supabaseClient.auth.getSession();S.user=data.session?.user||null;if(!S.user){showAuth(true);return}showAuth(false);await loadRemote()}
supabaseClient.auth.onAuthStateChange(async(_event,session)=>{S.user=session?.user||null;if(S.user){showAuth(false);await loadRemote()}else showAuth(true)});
initAuth();
normalizeEvents();
render();
</script>
</body>
</html>
